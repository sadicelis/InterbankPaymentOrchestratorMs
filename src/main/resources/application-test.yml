spring:
  profiles:
    active: test

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  h2:
    console:
      enabled: true

  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:

  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

bank:
  clients:
    BANCO_1:
      base-url: "http://localhost:9999/mock/bank1"
    BANCO_2:
      base-url: "http://localhost:9999/mock/bank2"

resilience4j:
  circuitbreaker:
    instances:
      bankService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 10s
  retry:
    instances:
      bankService:
        maxAttempts: 3
        waitDuration: 500ms

server:
  port: 8081

logging:
  level:
    root: WARN
    com.payments.orchestrator: DEBUG
