apiVersion: v1
kind: Secret
metadata:
  name: orchestrator-secrets
  namespace: payment-orchestrator
  labels:
    app: orchestrator
    component: secrets
type: Opaque
stringData:
  # Database credentials
  SPRING_DATASOURCE_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=paymentsdb;encrypt=true;trustServerCertificate=true"
  SPRING_DATASOURCE_USERNAME: "sa"
  SPRING_DATASOURCE_PASSWORD: "StrongPassword123!"
  
  # Bank API Keys (si fuera necesario en el futuro)
  BANK_CLIENTS_BANK_1_API_KEY: "bank1-api-key-placeholder"
  BANK_CLIENTS_BANK_2_API_KEY: "bank2-api-key-placeholder"
  
  # Application secret for JWT o CSRF (si se implementa en el futuro)
  APP_SECRET_KEY: "your-secret-key-change-in-production"
