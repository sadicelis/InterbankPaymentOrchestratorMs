spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=paymentsdb;encrypt=false;trustServerCertificate=true
    username: sa
    password: StrongPassword123!
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080