
spring:
  profiles:
    active: dev

  jpa:
    open-in-view: false

  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
bank:
  clients:
    BANCO_1:
      base-url: "http://localhost:8080/mock/bank"
    BANCO_2:
      base-url: "http://localhost:8080/mock/bank"

resilience4j:
  circuitbreaker:
    instances:
      bankService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 10s
  retry:
    instances:
      bankService:
        maxAttempts: 3
        waitDuration: 500ms
        
server:
  port: 8080